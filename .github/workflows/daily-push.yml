name: 每日X推文推送

on:
  schedule:
    - cron: '0 0 * * *'     # UTC 0点 = 北京时间早上8点
  workflow_dispatch:        # 允许手动触发测试

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 安装依赖
        run: |
          pip install feedparser translators requests
      
      - name: 运行脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
